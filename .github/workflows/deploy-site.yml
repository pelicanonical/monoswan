name: Deploy documentation site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-site.yml"
      - "apps/site/**"
      - "packages/configs/styles-config/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 26.6.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @monoswan/site build
      - run: pnpm --filter @monoswan/site check:links
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
